name: Unscroll
options:
  bundleIdPrefix: com.manaia
  deploymentTarget:
    iOS: "17.0"
targets:
  Unscroll:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Unscroll
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.manaia.unscroll
            CFBundleURLSchemes: [unscroll]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manaia.unscroll
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
