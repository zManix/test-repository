name: Build unsigned IPA
on:
  push:
    branches: [tapper-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project SimpleApp.xcodeproj -scheme SimpleApp \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SimpleApp.app Payload/
          zip -r SimpleApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleApp-ipa
          path: SimpleApp.ipa
      - name: Publish IPA to ipa branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir /tmp/out && cp SimpleApp.ipa /tmp/out/
          git checkout --orphan ipa-build
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/SimpleApp.ipa .
          git add SimpleApp.ipa
          git commit -m "Build IPA"
          git push origin HEAD:refs/heads/ipa
